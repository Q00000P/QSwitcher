# Релиз для Windows собирается на GitHub сам.
#
# Поднял Version в windows/src/QSwitcher.App/Program.cs и запушил в main → если релиза
# win-<версия> ещё нет, он создаётся: сборка, самопроверка, QSwitcher-win-<версия>.zip и
# version-win.json (манифест для сервера обновлений) в релизе, описание из
# release-notes/<версия>.md. Пересобрать уже выпущенную версию (например, после того как
# заданы секреты): Actions → Windows release → Run workflow — файлы релиза заменятся.
#
# Ключ Google Drive — только из секретов репозитория QS_GOOGLE_CLIENT_ID /
# QS_GOOGLE_CLIENT_SECRET (в коде его нет). Без них синхронизация через WebDAV
# работает, а Google Drive — только если те же переменные заданы на компьютере.
name: Windows release

on:
  push:
    branches: [main]
    paths:
      - windows/src/QSwitcher.App/Program.cs
      - release-notes/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия и наличие релиза
        shell: pwsh
        run: |
          $v = (Select-String -Path windows\src\QSwitcher.App\Program.cs -Pattern 'Version = "(.*)"').Matches[0].Groups[1].Value
          $tag = "win-$v"
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          "EXISTS=$([int]$exists)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          if ($exists -and '${{ github.event_name }}' -eq 'push') {
            "SKIP=1" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
            "Релиз $tag уже есть — пропускаю (пересборка: Run workflow)."
          } else { "Версия $v → $tag" }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: env.SKIP != '1'
        with:
          dotnet-version: 8.0.x

      - name: Словари (как в windows/README.md)
        if: env.SKIP != '1'
        shell: pwsh
        working-directory: windows/src/QSwitcher.App/Resources
        run: |
          curl.exe -fsSL --retry 3 -o en.txt https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt
          curl.exe -fsSL --retry 3 -o russian-raw.txt https://raw.githubusercontent.com/danakt/russian-words/master/russian.txt
          [System.Text.Encoding]::RegisterProvider([System.Text.CodePagesEncodingProvider]::Instance)
          $src = [System.IO.File]::ReadAllText("$PWD\russian-raw.txt", [System.Text.Encoding]::GetEncoding(1251))
          [System.IO.File]::WriteAllText("$PWD\ru.txt", $src, (New-Object System.Text.UTF8Encoding $false))
          Remove-Item russian-raw.txt
          "en.txt: $((Get-Content en.txt).Count), ru.txt: $((Get-Content ru.txt).Count)"

      - name: Сборка
        if: env.SKIP != '1'
        shell: pwsh
        env:
          QS_GOOGLE_CLIENT_ID: ${{ secrets.QS_GOOGLE_CLIENT_ID }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets.QS_GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:QS_GOOGLE_CLIENT_ID) { "::warning::Секреты QS_GOOGLE_CLIENT_ID / QS_GOOGLE_CLIENT_SECRET не заданы — Google Drive в сборку не встроен" }
          dotnet publish windows\src\QSwitcher.App -c Release -o publish

      - name: Самопроверка (ядро 5 + синхронизация)
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\QSwitcher.exe -ArgumentList '--selftest-core' -Wait -PassThru -NoNewWindow
          $report = Join-Path $env:LOCALAPPDATA 'QSwitcher\test-report.txt'
          if (Test-Path $report) { Get-Content $report -Tail 5 }
          if ($p.ExitCode -ne 0) { throw "самопроверка: код $($p.ExitCode)" }

      - name: Архив и манифест
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $zip = "QSwitcher-win-$env:VERSION.zip"
          Compress-Archive -Path publish\QSwitcher.exe -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            version   = $env:VERSION
            sha256    = $sha
            url       = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$zip"
            page      = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG"
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json | Set-Content -Path version-win.json -Encoding UTF8
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "SHA256: $sha"

      - name: Релиз
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          if ($env:EXISTS -ne '1') {
            $notes = "release-notes/$env:VERSION.md"
            if (-not (Test-Path $notes)) { "Сборка $env:VERSION для Windows." | Set-Content $notes -Encoding UTF8 }
            gh release create $env:TAG --target $env:GITHUB_SHA --title "QSwitcher для Windows $env:VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create: $LASTEXITCODE" }
          }
          gh release upload $env:TAG $env:ZIP version-win.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload: $LASTEXITCODE" }
