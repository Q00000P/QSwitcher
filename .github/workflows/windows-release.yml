# Релиз для Windows: собирается на GitHub и прикрепляется к релизу win-<версия>.
#
# Запуск: запушить тег win-X.Y (версия = Version в Program.cs) — релиз создаётся сам,
# описание берётся из release-notes/X.Y.md. Пересобрать: Actions → Windows release →
# Run workflow (тег вида win-X.Y) или Re-run у прошлого запуска.
# Ключ Google Drive — только из секретов репозитория QS_GOOGLE_CLIENT_ID /
# QS_GOOGLE_CLIENT_SECRET (в коде его нет). Без них синхронизация через WebDAV
# работает, Google Drive в сборке недоступен.
name: Windows release

on:
  push:
    tags: ['win-*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (win-X.Y)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия совпадает с тегом
        shell: pwsh
        run: |
          $v = (Select-String -Path windows\src\QSwitcher.App\Program.cs -Pattern 'Version = "(.*)"').Matches[0].Groups[1].Value
          if ("win-$v" -ne $env:TAG) { throw "Тег $env:TAG, а в Program.cs версия $v" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Словари (как в windows/README.md)
        shell: pwsh
        working-directory: windows/src/QSwitcher.App/Resources
        run: |
          curl.exe -fsSL --retry 3 -o en.txt https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt
          curl.exe -fsSL --retry 3 -o russian-raw.txt https://raw.githubusercontent.com/danakt/russian-words/master/russian.txt
          [System.Text.Encoding]::RegisterProvider([System.Text.CodePagesEncodingProvider]::Instance)
          $src = [System.IO.File]::ReadAllText("$PWD\russian-raw.txt", [System.Text.Encoding]::GetEncoding(1251))
          [System.IO.File]::WriteAllText("$PWD\ru.txt", $src, (New-Object System.Text.UTF8Encoding $false))
          Remove-Item russian-raw.txt
          "en.txt: $((Get-Content en.txt).Count), ru.txt: $((Get-Content ru.txt).Count)"

      - name: Сборка
        shell: pwsh
        env:
          QS_GOOGLE_CLIENT_ID: ${{ secrets.QS_GOOGLE_CLIENT_ID }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets.QS_GOOGLE_CLIENT_SECRET }}
        run: dotnet publish windows\src\QSwitcher.App -c Release -o publish

      - name: Самопроверка (ядро 5 + синхронизация)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\QSwitcher.exe -ArgumentList '--selftest-core' -Wait -PassThru -NoNewWindow
          $report = Join-Path $env:LOCALAPPDATA 'QSwitcher\test-report.txt'
          if (Test-Path $report) { Get-Content $report -Tail 5 }
          if ($p.ExitCode -ne 0) { throw "самопроверка: код $($p.ExitCode)" }

      - name: Архив и манифест
        shell: pwsh
        run: |
          $zip = "QSwitcher-win-$env:VERSION.zip"
          Compress-Archive -Path publish\QSwitcher.exe -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            version   = $env:VERSION
            sha256    = $sha
            url       = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$zip"
            page      = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG"
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json | Set-Content -Path version-win.json -Encoding UTF8
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "SHA256: $sha"

      - name: Прикрепить к релизу
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "release-notes/$env:VERSION.md"
            if (Test-Path $notes) { gh release create $env:TAG --title "QSwitcher для Windows $env:VERSION" --notes-file $notes }
            else { gh release create $env:TAG --title "QSwitcher для Windows $env:VERSION" --notes "Сборка $env:VERSION для Windows." }
          }
          gh release upload $env:TAG $env:ZIP version-win.json --clobber
